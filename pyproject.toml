[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fin-checkup"
version = "0.1.0"
description = "DART 공시 기반 재무 건강검진 — 재무비율을 신호등으로, 위험 공시는 사실만"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Younghwan Chae" }]
# 라이선스와 무관한 업로드 방지턱이다. PyPI에 올릴 계획이 없어 실수로 나가지 않게 막아둔다.
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "duckdb>=1.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tzdata>=2026.3",
    "jinja2>=3.1.6",
    "pillow>=11.0",
]

[project.scripts]
# MCP 서버 — `uvx --from "fin-checkup[mcp] @ git+https://github.com/younghwan91/fin-checkup" fin-checkup-mcp`
fin-checkup-mcp = "fin_checkup.mcp.server:main"
# CLI — 저장소 없이 `uvx --from "fin-checkup @ git+https://github.com/younghwan91/fin-checkup" fin-checkup setup`
fin-checkup = "fin_checkup.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
ui = [
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    # 화면을 실제로 띄워 확인할 때 쓴다. 표시 결함은 캡처를 봐야만 드러난다.
    "playwright>=1.40.0",
    "jsonschema>=4.21",
]
mcp = [
    "mcp>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fin_checkup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# 한글 주석·문자열이 많아 100자는 지나치게 빡빡하다.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum 상속은 의도적이다 — pydantic 직렬화와 DART 코드값 비교를 위해.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Depends()·Query()를 기본값에 두는 건 FastAPI의 표준 관용구다.
"src/fin_checkup/api/*.py" = ["B008"]
# 해설 모듈은 문장이 데이터다. 한 문장을 여러 줄 문자열로 쪼개면 읽고 고치기 어렵다.
"src/fin_checkup/explain/*.py" = ["E501"]
# MCP 도구 설명·안내문도 문장이 데이터다 (모델이 그대로 읽는다).
"src/fin_checkup/mcp/*.py" = ["E501"]
# 설치 도우미 안내문도 같다 (사용자·에이전트가 그대로 읽는다).
"src/fin_checkup/onboarding.py" = ["E501"]
