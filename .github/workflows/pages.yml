name: Pages

# 공개 스냅샷(data-* 릴리스) → 캐시 재구성 → 정적 사이트 빌드 → GitHub Pages.
#
# 사이트 빌드는 캐시만 읽는다(DART 호출 0). 스냅샷은 collect.yml(매일 04:00 KST 증분 수집)이나
# 로컬에서 `scripts/publish_snapshot.sh` 가 허용목록 테이블만 뽑아 릴리스로 올린다 —
# 개인정보·운영 테이블은 스냅샷에 아예 없다(snapshot.py). collect.yml 이 GITHUB_TOKEN 으로 만든
# 릴리스는 아래 `release` 트리거를 깨우지 않아서, collect.yml 이 이 워크플로를 직접 디스패치한다.
#
# DART 를 부르는 건 "최근 위험 공시" 한 단계뿐이고, secret DART_API_KEY 가 있을 때만 돈다.
# 키는 그 단계의 env 로만 넘긴다(로그·산출물에 안 남게). 같은 키를 로컬 수집이 함께 쓰면
# 일별 허용량을 나눠 쓰게 되므로 --max-pages 로 최대 호출 수를 묶는다(5 × 30 = 150).

on:
  workflow_dispatch:
    inputs:
      year:
        description: "기준 사업연도 (비우면 빌더 기본값)"
        required: false
        default: ""
  release:
    types: [published]
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포를 끊으면 사이트가 반쯤 바뀐 채 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://younghwan91.github.io/fin-checkup/
  # pydantic-settings 가 읽는다. 워크스페이스 안의 새 파일 — .env 는 없다.
  FIN_CHECKUP_DB_PATH: _snapshot/fin_checkup.duckdb

jobs:
  build:
    # 코드 릴리스가 생겨도 데이터 릴리스(data-*)일 때만 돈다.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'data-')
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.snapshot.outputs.found }}
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 메이저 이동 태그를 안 낸다 — ci.yml 과 같은 정확한 릴리스 태그로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 의존성 설치 (lock 고정)
        run: uv sync --frozen

      # 릴리스 이벤트면 그 태그, 아니면 가장 최근 data-* 를 받아 들여온다 (collect.yml 과 같은 스크립트).
      # 없으면 경고만 남기고 found=false — 배포하지 않는다.
      - name: 스냅샷 받아 캐시 재구성
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: scripts/fetch_snapshot.sh _snapshot "$RELEASE_TAG"

      # 스냅샷의 metric_values 는 그걸 만든 시점 코드의 계산 결과다. 지표 계산을 고친 PR 이 병합돼도
      # 스냅샷을 다시 올리기 전까지 대조군(동종업계 분포)이 옛 계산으로 남는다 — 배포마다 지금 코드로
      # 다시 계산한다. 원본 재무(statement_lines)만 읽고 DART 는 부르지 않는다.
      - name: 지표 값 다시 계산 (지금 코드 기준)
        if: steps.snapshot.outputs.found == 'true'
        run: uv run python -m fin_checkup.cli backfill --years 5

      - name: 최근 위험 공시 (DART_API_KEY 가 있을 때만)
        id: disclosures
        if: steps.snapshot.outputs.found == 'true'
        # DART 장애·한도 초과로 사이트 배포까지 막지 않는다. 실패하면 이번 빌드엔 공시가 빠진다.
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::notice::secret DART_API_KEY 가 없어 최근 위험 공시를 건너뛴다."
            exit 0
          fi
          uv run python -m fin_checkup.cli disclosures fetch --days 7 --max-pages 30 \
            --out _site-data/disclosures.json

      # 공유 카드 PNG(og/<코드>.png)의 한국어 글꼴. 러너엔 한글 글꼴이 없다 — 없으면 빌드는 PNG 와
      # og:image 를 빼고 경고만 남긴다(두부 □ 그림을 내지 않게). 글꼴 경로는 site/images/fonts.py 가 찾는다.
      - name: 한국어 글꼴 (공유 카드 PNG)
        if: steps.snapshot.outputs.found == 'true'
        continue-on-error: true
        run: |
          if fc-list :lang=ko | grep -q .; then
            echo "한국어 글꼴이 이미 있다"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi
          fc-list :lang=ko family | sort -u | head -5

      # 증분 빌드 캐시(site/incremental.py) — 코드·데이터가 같으면 건강검진과 공유 카드 PNG 를 다시 만들지 않는다.
      # 열쇠에 run_id 를 넣어 매번 새로 저장하고, 가장 최근 것을 이어 쓴다. 이 워크플로는 PR 로 돌지 않아
      # 포크가 만든 캐시를 읽지 않는다(캐시는 pickle 이라 남이 만든 것을 읽으면 안 된다).
      - name: 증분 빌드 캐시
        if: steps.snapshot.outputs.found == 'true'
        uses: actions/cache@v6
        with:
          path: _build-cache
          key: site-build-${{ github.run_id }}
          restore-keys: site-build-

      - name: 사이트 빌드
        if: steps.snapshot.outputs.found == 'true'
        env:
          YEAR: ${{ inputs.year }}
          DISCLOSURES_OK: ${{ steps.disclosures.outcome == 'success' }}
        run: |
          # --snapshot: 꼬리의 데이터 기준 줄과 /build.json 에 스냅샷 manifest 날짜를 적는다.
          # --jobs: 러너 CPU 수만큼 건강검진을 나눠 계산한다 (로컬 16코어 실측: 45초 → 12초 안팎).
          args=(--out site-out --base-url "$SITE_URL" --snapshot _snapshot/files
                --jobs "$(nproc)" --incremental _build-cache)
          if [ -n "$YEAR" ]; then args+=(--year "$YEAR"); fi
          # 공시 단계가 성공해 파일을 남겼을 때만 넘긴다. 빌더가 회사 페이지·첫 화면 공시 섹션,
          # 회사별·시장 전체 Atom 피드(feeds/)의 공시 항목, /data/disclosures.json 을 만든다.
          if [ "$DISCLOSURES_OK" = "true" ] && [ -f _site-data/disclosures.json ]; then
            args+=(--disclosures _site-data/disclosures.json)
          fi
          uv run python -m fin_checkup.cli site build "${args[@]}"

      # IndexNow (site/indexnow.py) — 이번 빌드의 페이지 지문을 page-digests.json 으로 사이트에 싣고, 라이브 사이트의
      # 지문(지난 배포)과 비교해 바뀐 주소만 고른다. 라이브에 지문이 없으면(404, 처음 한 번) 색인 페이지 전부.
      # 보내기는 배포 뒤 indexnow 작업이 한다 — 열쇠 파일이 라이브에 있어야 검색 엔진이 확인할 수 있다.
      # 가드보다 먼저 — 지문 파일도 가드를 거친다. 여기서 실패해도 배포는 막지 않는다.
      - name: IndexNow 보낼 주소
        id: indexnow
        if: steps.snapshot.outputs.found == 'true'
        continue-on-error: true
        run: |
          uv run python -m fin_checkup.site.indexnow plan site-out --base-url "$SITE_URL" \
            --out _indexnow/payload.json
          if [ -f _indexnow/payload.json ]; then echo "payload=true" >> "$GITHUB_OUTPUT"; fi

      # 넘지 않는 선을 산출물에서 직접 확인한다(면책·계산식·CSP·외부 스크립트·인증키 — site/guard.py).
      # 하나라도 걸리면 배포하지 않는다.
      - name: 산출물 가드
        if: steps.snapshot.outputs.found == 'true'
        # 상장사는 2,500곳 남짓이다. 데이터에 없는 사업연도로 빌드하면 몇 곳짜리 사이트가 나가므로 막는다.
        run: uv run python -m fin_checkup.cli site check site-out --min-companies 2000

      # 내부 링크(상대경로·SITE_URL 아래 절대주소·#앵커)가 실제 파일로 이어지는지. 깨지면 배포하지 않는다.
      # 외부 링크는 목록만 남긴다 — 네트워크를 부르지 않고, 남의 사이트 장애로 배포를 막지 않는다.
      - name: 링크 검사
        if: steps.snapshot.outputs.found == 'true'
        run: uv run python -m fin_checkup.cli site links site-out --base-url "$SITE_URL"

      - uses: actions/upload-artifact@v7
        if: steps.indexnow.outputs.payload == 'true'
        with:
          name: indexnow-payload
          path: _indexnow/payload.json
          retention-days: 3

      - uses: actions/upload-pages-artifact@v5
        if: steps.snapshot.outputs.found == 'true'
        with:
          path: site-out

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 배포가 성공한 뒤에만, 이 저장소의 기본 브랜치(또는 data-* 릴리스 — 같은 운영 사이트를 배포한다)에서만.
  # 이 워크플로엔 PR 트리거가 없고, 포크·다른 브랜치에서 수동 실행한 것은 운영 사이트가 아니라 보내지 않는다.
  # 보내기가 실패해도(403·429·연결 실패) HTTP 상태만 남기고 작업은 성공한다 — 배포는 이미 끝났다.
  indexnow:
    needs: [build, deploy]
    if: >-
      needs.build.outputs.indexnow == 'true' &&
      github.repository == 'younghwan91/fin-checkup' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/data-')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: indexnow-payload
          path: _indexnow

      - name: IndexNow 알림 (실패해도 배포는 그대로)
        continue-on-error: true
        run: uv run --frozen python -m fin_checkup.site.indexnow submit _indexnow/payload.json
