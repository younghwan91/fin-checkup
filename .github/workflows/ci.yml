name: CI

# 테스트와 린트를 푸시·PR마다 돌린다.
#
# 이 레포는 419개 테스트가 있지만 지금까지 CI에서는 커밋 신원만 검사했다.
# 로컬에서 안 돌리고 밀어도 아무도 모른다 — 공개 레포에서 그건 위험하다.
#
# .env 없이 돌아가야 한다. 테스트는 conftest의 Settings 픽스처로 키를 주입하므로
# 실제 DART·텔레그램 키가 필요 없다(로컬에서 .env 를 치우고 검증함).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.11 이라 하한과 개발 환경(3.13) 둘 다 본다.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 메이저 이동 태그(v10)를 안 낸다 — 정확한 릴리스 태그로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 의존성 설치 (lock 고정)
        run: uv sync --all-extras --frozen

      # PNG 그리기 테스트(tests/test_site_images.py)가 글꼴 지표로 넘침을 잰다. 글꼴이 없으면 건너뛰므로
      # 여기서 깔아야 CI 가 실제로 검사한다. pages.yml 과 같은 패키지.
      - name: 한국어 글꼴
        run: |
          if fc-list :lang=ko | grep -q .; then
            echo "한국어 글꼴이 이미 있다"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi

      - name: ruff check
        run: uv run ruff check src tests scripts

      - name: pytest
        run: uv run pytest -q

  # 태그를 밀기 전에 번들이 실제로 만들어지고 뜨는지 본다 — release.yml 과 같은 명령(올리기·레지스트리는 빼고).
  mcpb:
    runs-on: ubuntu-latest
    env:
      MCPB_VERSION: "2.1.2"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 의존성 설치 (lock 고정)
        run: uv sync --frozen --extra mcp --extra dev

      - name: 버전 일치
        run: uv run python scripts/release.py check-tag

      - name: 릴리스 가드 테스트
        run: uv run pytest -q tests/test_release.py

      - name: 번들 만들기·검사
        run: |
          uv run python scripts/release.py stage _mcpb
          npx -y "@anthropic-ai/mcpb@${MCPB_VERSION}" validate _mcpb/manifest.json
          npx -y "@anthropic-ai/mcpb@${MCPB_VERSION}" pack _mcpb fin-checkup.mcpb

      - name: 번들 실행 확인 (stdio)
        run: uv run python scripts/release.py smoke fin-checkup.mcpb
