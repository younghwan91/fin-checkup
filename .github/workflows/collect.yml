name: Collect

# 재무제표 자동 갱신 — 최근 data-* 스냅샷 → 증분 수집(DART) → 새 스냅샷 릴리스 → Pages 배포 요청.
#
# 매일 04:00 KST 에 돈다(pages.yml 의 07:00 KST 빌드 전). `cli collect`(src/fin_checkup/collect.py)가
# 상장사 중 재무가 없는 (회사, 연도)만 --budget 안에서 받는다. 같은 인증키를 로컬·pages.yml 의 공시 수집이
# 함께 쓰므로(일별 20,000건) 기본 예산은 12,000건. 020(일별 한도 초과)이면 거기서 멈추고 받은 것까지 올린다.
# 호출량 기록(dart_call_log)은 스냅샷에 없어서, 이 작업은 그날 로컬에서 쓴 호출 수를 모른다 — 예산이 그 몫이다.
#
# 키는 secret DART_API_KEY 를 "증분 수집"·"새 스냅샷 릴리스" 두 단계의 env 로만 넘긴다. 뒤쪽은 DART 를
# 부르지 않는다 — export 가 산출물에 키가 섞였는지 검사하려면 키 값을 알아야 해서다(snapshot.py).
#
# GITHUB_TOKEN 으로 만든 릴리스는 다른 워크플로의 `release` 트리거를 깨우지 않는다(GitHub 의 재귀 방지).
# 그래서 pages.yml 의 `release: published` 는 여기서 올린 릴리스로는 돌지 않는다 — 새 데이터가 있으면
# `gh workflow run pages.yml` 로 직접 배포를 요청한다(workflow_dispatch 는 예외로 허용된다, actions: write).

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST
  workflow_dispatch:
    inputs:
      budget:
        description: "최대 DART 호출 수 (일별 한도 20,000건을 로컬·Pages 와 나눠 쓴다)"
        required: false
        default: "12000"
      years:
        description: "사업연도, 공백으로 구분 (예: 2021 2022). 비우면 새 보고서가 들어올 해와 그 전 해"
        required: false
        default: ""

permissions:
  contents: write # 새 data-* 릴리스 · 옛 릴리스 정리
  actions: write # pages.yml 디스패치

# 수집 둘이 겹치면 같은 회사를 두 번 묻고, 나중 릴리스가 먼저 것을 덮는다. 진행 중인 것은 끊지 않는다.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  # pydantic-settings 가 읽는다. 워크스페이스 안의 새 파일 — .env 는 없다.
  FIN_CHECKUP_DB_PATH: _snapshot/fin_checkup.duckdb
  # 캐시의 시각(fetch_misses·corp_codes 의 fetched_at)은 시간대 없는 로컬 시각이다. 스냅샷을 만든
  # 로컬(KST)과 같은 시간대로 써야 빈 응답 TTL 이 9시간씩 어긋나지 않는다.
  TZ: Asia/Seoul
  GH_REPO: ${{ github.repository }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # 상장사 ~2,800곳 × 2년 × CFS·OFS = 최대 ~11,000건. 호출 사이 0.3초 + 해외 러너의 왕복을 더하면
    # 건당 1초 안팎이라 3시간 남짓. 수집은 --max-minutes 270 에서 스스로 멈추고, 나머지 시간에 올린다.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 메이저 이동 태그를 안 낸다 — ci.yml·pages.yml 과 같은 정확한 릴리스 태그로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 의존성 설치 (lock 고정)
        run: uv sync --frozen

      - name: 최근 스냅샷으로 캐시 재구성
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_snapshot.sh _snapshot

      - name: 증분 수집
        id: collect
        if: steps.snapshot.outputs.found == 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BUDGET: ${{ inputs.budget || '12000' }}
          YEARS: ${{ inputs.years }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::secret DART_API_KEY 가 없어 수집할 수 없다."
            exit 1
          fi
          if ! [[ "$BUDGET" =~ ^[0-9]+$ ]]; then
            echo "::error::budget 은 숫자여야 한다: $BUDGET"
            exit 1
          fi
          if ! [[ "$YEARS" =~ ^[0-9[:space:]]*$ ]]; then
            echo "::error::years 는 공백으로 구분한 연도여야 한다: $YEARS"
            exit 1
          fi
          args=(--budget "$BUDGET" --max-minutes 270 --summary-json _collect/summary.json)
          read -ra years <<< "$YEARS"
          if [ "${#years[@]}" -gt 0 ]; then args+=(--years "${years[@]}"); fi

          # 오류로 멈춰도(종료 1) 받은 데까지는 올린다 — 실패 표시는 마지막 단계에서.
          set +e
          uv run python -m fin_checkup.cli collect "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -f _collect/summary.json ]; then
            echo "::error::수집 요약이 없다 (종료 $code)."
            exit 1
          fi
          jq -r '"changed=\(.changed)", "new_data=\(.new_data)", "fetched=\(.fetched)",
                 "calls=\(.calls)", "stopped=\(.stopped // "")"' _collect/summary.json >> "$GITHUB_OUTPUT"
          jq -r '"### 증분 수집",
                 "",
                 "| 연도 | 예산 | 호출 | 새 재무 | 없음 | 건너뜀 | 실패 | 기업개황 | 남음 | 분기 주요계정 | 멈춘 이유 |",
                 "|---|---|---|---|---|---|---|---|---|---|---|",
                 "| \(.years | map(tostring) | join(", ")) | \(.budget) | \(.calls) | \(.fetched) | \(.empty) | \(.skipped) | \(.failed) | \(.companies) | \(.remaining) | \(.quarter_fetched // 0) (\(.quarter_reports // [] | join(", "))) | \(.stopped // "-") |"' \
            _collect/summary.json >> "$GITHUB_STEP_SUMMARY"
          stopped="$(jq -r '.stopped // ""' _collect/summary.json)"
          if [ "$stopped" = "quota" ]; then
            echo "::warning::DART 일별 호출 허용량(020)을 넘어 멈췄다. 받은 것까지 올리고, 내일 이어받는다."
          fi

      # 스냅샷의 metric_values 를 지금 코드·새 재무로 맞춘다 (pages.yml 도 배포 때 다시 계산한다). DART 호출 없음.
      - name: 지표 값 다시 계산
        if: steps.collect.outputs.changed == 'true'
        run: uv run python -m fin_checkup.cli backfill --years 5

      - name: 새 스냅샷 릴리스
        id: publish
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # DART 를 부르지 않는다. export 가 산출물에 키가 섞였는지 검사하는 데만 쓴다.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SNAPSHOT_NOTES: "Actions 증분 수집: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (이전 스냅샷 ${{ steps.snapshot.outputs.tag }})"
        run: scripts/publish_snapshot.sh

      # 스냅샷은 매번 전체다 — 최근 것만 있으면 된다. 올린 시각(publishedAt — createdAt 은 커밋 시각이다) 기준
      # 최근 7개를 남기고, 방금 올린 것은 절대 지우지 않는다.
      - name: 옛 스냅샷 릴리스 정리 (최근 7개)
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          gh release list --limit 200 --json tagName,isDraft,publishedAt \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("data-"))]
                  | sort_by(.publishedAt) | reverse | .[7:] | .[].tagName' |
          while read -r old; do
            if [ -z "$old" ] || [ "$old" = "$NEW_TAG" ]; then continue; fi
            echo "지운다: $old"
            gh release delete "$old" --yes --cleanup-tag
          done

      - name: Pages 배포 요청
        if: steps.publish.outcome == 'success' && steps.collect.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          # --ref 를 주지 않으면 기본 브랜치(main)의 pages.yml 이 돈다. 가장 최근 data-* 를 찾아 빌드한다.
          gh workflow run pages.yml
          echo "::notice::새 스냅샷 $NEW_TAG — pages.yml 배포를 요청했다."

      - name: 새 데이터 없음
        if: steps.collect.outcome == 'success' && steps.collect.outputs.changed != 'true'
        run: echo "::notice::새로 받은 재무·기업개황·빈 응답이 없어 릴리스를 만들지 않았다."

      - name: 수집 오류
        if: steps.collect.outputs.exit_code != '' && steps.collect.outputs.exit_code != '0'
        run: |
          echo "::error::수집이 오류로 멈췄다 (받은 것은 위에서 올렸다). 로그의 '!!' 줄을 볼 것."
          exit 1
