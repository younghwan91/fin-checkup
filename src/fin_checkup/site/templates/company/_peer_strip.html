{#
  지표 카드 안: 동종업계 분포 위 이 회사의 위치 (charts.peer_strip). ⊘·⚫·대조군 없음이면 아무것도 내지 않는다. 순위가 아니라 분포.
  휴대폰에서 카드 하나가 한 화면을 넘지 않게, 숫자 요약(대조군·가운데 50%·중앙값·이 회사)은 늘 보이고 그림·범례만 눌러 펼친다.
  계산식·경계값은 이 밖(_metrics.html)에 늘 보인다.
#}
{% set strip = peer_strips.get(m.key) %}
{% if strip %}
<figure class="fc-peer">
  <figcaption class="fc-peer-head"><b>{{ strip.title }}</b> · {{ strip.position_text }}</figcaption>
  {{ strip.svg }}
  <figcaption class="fc-peer-key"><span><span class="fc-key fc-key-box" aria-hidden="true"></span>회색 상자: 섹터 중간 50%</span> <span><span class="fc-key fc-key-median" aria-hidden="true"></span>검은 선: 중앙값</span> <span><span class="fc-key fc-key-mine" aria-hidden="true"></span>파란 점: {{ strip.value_text }}</span>{% if strip.has_band %} <span>· 아래 색 띠: 정상·주의·위험 구간</span>{% endif %}</figcaption>
</figure>
{% endif %}
